name: Lofi
options:
  bundleIdPrefix: com.hashinokuchi
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: ja
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Lofi:
    type: application
    platform: iOS
    sources:
      - path: Lofi
        excludes: [Resources]
      - path: Lofi/Resources
        buildPhase: resources
    info:
      path: Lofi/Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    settings:
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: 'debug-collection-*'
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        PRODUCT_BUNDLE_IDENTIFIER: com.hashinokuchi.lofi
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lofi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  LofiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LofiTests]
    dependencies:
      - target: Lofi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LofiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LofiUITests]
    dependencies:
      - target: Lofi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lofi:
    build:
      targets:
        Lofi: all
        LofiTests: [test]
        LofiUITests: [test]
    test:
      targets: [LofiTests, LofiUITests]
